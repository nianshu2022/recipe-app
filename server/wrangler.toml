name = "recipe-app-api"
main = "src/index.ts"
compatibility_date = "2024-12-01"

# JWT_SECRET must be set via: wrangler secret put JWT_SECRET
# RESEND_API_KEY must be set via: wrangler secret put RESEND_API_KEY
# (Optional, only needed for email verification codes)

[[d1_databases]]
binding = "DB"
database_name = "recipe-app-db"
database_id = "ab7b27b9-eed5-449f-a281-9d409b10d042"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "recipe-app-media"

[env.dev]
name = "recipe-app-api-dev"

[[env.dev.d1_databases]]
binding = "DB"
database_name = "recipe-app-db-dev"
database_id = "placeholder-dev"
